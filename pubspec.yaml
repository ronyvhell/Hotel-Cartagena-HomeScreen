name: hotel_cartagena_flutter
description: >
  Aplicación Flutter para la administración de habitaciones y huéspedes
  del Hotel Cartagena (registro, login, reservas, check-in, check-out
  y consulta de disponibilidad) mediante ventanas sencillas.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
