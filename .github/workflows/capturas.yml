name: Capturas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capturas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: |
          export FLUTTER_ROOT="$(dirname "$(dirname "$(which flutter)")")"
          ls -R "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts" | head -20 | sed 's/^/::notice ::/'
          PREFIJO=despues flutter test capturas/ --update-goldens > out.txt 2>&1 || { tail -40 out.txt | sed 's/^/::error ::/'; exit 1; }
          cp docs/antes/main.dart lib/main.dart
          cp docs/antes/home_screen.dart docs/antes/login_screen.dart docs/antes/rooms_screen.dart docs/antes/reserve_screen.dart lib/screens/
          PREFIJO=antes flutter test capturas/ --update-goldens > out.txt 2>&1 || { tail -40 out.txt | sed 's/^/::error ::/'; exit 1; }
      # Publica las PNG en la rama "capturas".
      - run: |
          cp -r capturas/out /tmp/out
          git checkout --orphan capturas
          git rm -rfq .
          cp /tmp/out/*.png .
          git add *.png
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Capturas"
          git push -f origin capturas
